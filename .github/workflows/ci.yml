name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - run: pnpm structure
      - run: pnpm guard:fakes
      - run: pnpm exec biome check .
      - run: pnpm deps
      - run: pnpm turbo run build
      - run: pnpm turbo run typecheck
      # Wall-clock scale tests need dedicated hardware; shared runners fail them on timing alone.
      # The --exclude is a vitest flag, so node --test in scale-k6 gets its own step (its tests are not wall-clock).
      - run: pnpm -r --filter='!@anvesx/scale-k6' run test --exclude '**/tests/scale/**'
      - run: pnpm --filter @anvesx/scale-k6 run test
      # A push checks every commit since the previous tip; a pull request checks its own commits. A new branch
      # (all-zero before sha) or a force push (before sha no longer in the clone) falls back to the last commit.
      - name: commitlint
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD~1
          fi
          pnpm exec commitlint --from "$BASE" --to HEAD
  mutation-plan:
    # Decides which packages need mutation testing (see scripts/ci/mutation-plan.sh).
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - id: plan
        run: |
          packages="$(scripts/ci/mutation-plan.sh)"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "$packages" | jq -r '.[].name' | sed 's/^/mutate: /'
  mutation-package:
    # One job per package so no single job nears the runner time cap.
    # Every package must meet its own break threshold of 80.
    needs: mutation-plan
    if: needs.mutation-plan.outputs.packages != '[]'
    name: mutation (${{ matrix.package.name }}${{ matrix.package.shards > 1 && format(' {0}/{1}', matrix.package.shard, matrix.package.shards) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.mutation-plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - run: pnpm turbo run build --filter="${PKG}..."
        env:
          PKG: ${{ matrix.package.name }}
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.package.dir }}/reports/stryker-incremental-${{ matrix.package.shard }}.json
          key: stryker-${{ matrix.package.name }}-${{ matrix.package.shard }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.package.name }}-${{ matrix.package.shard }}-
      - run: |
          args=(--incremental --incrementalFile "reports/stryker-incremental-${SHARD}.json")
          if [ "$SHARDS" -gt 1 ]; then
            args+=(--mutate "$(node scripts/ci/mutation-shard.mjs "$DIR" "$SHARD" "$SHARDS")")
          fi
          pnpm --filter "${PKG}" mutation "${args[@]}"
        env:
          PKG: ${{ matrix.package.name }}
          DIR: ${{ matrix.package.dir }}
          SHARD: ${{ matrix.package.shard }}
          SHARDS: ${{ matrix.package.shards }}
          GITHUB_ACTIONS: ""
  mutation:
    # Single required check: fails unless the plan ran and every package passed.
    needs: [mutation-plan, mutation-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "$PLAN" = success || { echo "plan job: $PLAN"; exit 1; }
          if [ "$PACKAGES" = "[]" ]; then
            test "$RESULT" = skipped || { echo "empty plan but result: $RESULT"; exit 1; }
            echo "no packages affected by this change"
          else
            test "$RESULT" = success || { echo "package jobs: $RESULT"; exit 1; }
          fi
        env:
          PLAN: ${{ needs.mutation-plan.result }}
          PACKAGES: ${{ needs.mutation-plan.outputs.packages }}
          RESULT: ${{ needs.mutation-package.result }}
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - run: pnpm turbo run build
      # turbo exits 0 when no package defines the task, so fail first if none does.
      - name: some package defines the integration task
        run: |
          pnpm exec turbo run integration --dry=json \
            | node -e 'const t = JSON.parse(require("fs").readFileSync(0, "utf8")).tasks.filter((x) => x.task === "integration" && x.command !== "<NONEXISTENT>"); if (t.length === 0) { console.error("no package defines an integration script"); process.exit(1); } console.log(t.map((x) => x.taskId).join("\n"))'
      - run: pnpm turbo run integration
  e2e:
    # Playwright against the real apps/connections launcher; @anvesx/connectors comes from the registry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - run: pnpm turbo run build --filter=@anvesx/connections-app
      - run: pnpm --filter @anvesx/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @anvesx/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tools/e2e/playwright-report/
            tools/e2e/test-results/
          if-no-files-found: warn
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        env:
          # From gitleaks_8.28.0_checksums.txt, published with the v8.28.0 release.
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with: { scan-args: "--lockfile=pnpm-lock.yaml" }

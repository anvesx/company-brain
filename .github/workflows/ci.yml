name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      # TEMPORARY: brain-app and connections-app (and e2e, which runs brain-app) consume @anvesx/connectors by a
      # sibling link:. Drop the filters once it is published and they use a version.
      - run: pnpm install --frozen-lockfile
      - run: pnpm structure
      - run: pnpm guard:fakes
      - run: pnpm exec biome check .
      - run: pnpm deps
      - run: pnpm turbo run build --filter='!@anvesx/brain-app' --filter='!@anvesx/connections-app' --filter='!@anvesx/e2e'
      - run: pnpm turbo run typecheck --filter='!@anvesx/brain-app' --filter='!@anvesx/connections-app' --filter='!@anvesx/e2e'
      - run: pnpm turbo run test --filter='!@anvesx/brain-app' --filter='!@anvesx/connections-app' --filter='!@anvesx/e2e'
      - run: pnpm turbo run mutation --filter='!@anvesx/brain-app' --filter='!@anvesx/connections-app' --filter='!@anvesx/e2e'
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to HEAD
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter='!@anvesx/brain-app' --filter='!@anvesx/connections-app' --filter='!@anvesx/e2e'
      - run: pnpm turbo run integration --filter='!@anvesx/brain-app' --filter='!@anvesx/connections-app' --filter='!@anvesx/e2e'
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with: { scan-args: "--lockfile=pnpm-lock.yaml" }

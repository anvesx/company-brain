name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  pull-requests: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm, registry-url: "https://npm.pkg.github.com", scope: "@anvesx" }
      - run: pnpm install --frozen-lockfile
      # Only the shared contract packages are public; the rest are private.
      - run: pnpm turbo run build --filter=@anvesx/core-types --filter=@anvesx/connector-kit
      # Publishes every public package whose version is not on the registry yet.
      # Bump versions with `pnpm changeset version` and commit; no PR bot needed.
      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: confirm the packages exist on GitHub Packages
        run: gh api "/orgs/anvesx/packages?package_type=npm" --jq '.[] | .name + " " + .visibility'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - run: pnpm dlx @cyclonedx/cdxgen -o sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }

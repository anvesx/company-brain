# docker compose up --build   (from apps/brain; export BRAIN_AUTH_SECRET and BRAIN_AUDIT_KEY first, 32+ characters each)
services:
  brain:
    build:
      context: ../..
      dockerfile: apps/brain/Dockerfile
    environment:
      BRAIN_HOST: 0.0.0.0
      BRAIN_PORT: "3000"
      BRAIN_DATA_DIR: /data
      BRAIN_AUTH_SECRET: ${BRAIN_AUTH_SECRET:?set BRAIN_AUTH_SECRET}
      BRAIN_AUDIT_KEY: ${BRAIN_AUDIT_KEY:?set BRAIN_AUDIT_KEY}
      # Host header values include the port; add your public name here.
      BRAIN_ALLOWED_HOSTS: ${BRAIN_ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000}
      # Set BRAIN_FOLDER_ROOT and BRAIN_TENANT (and mount the folder) to serve real documents instead of the demo.
      BRAIN_DEMO: "1"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - brain-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  brain-data:
